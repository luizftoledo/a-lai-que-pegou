<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 960 360" role="img" aria-labelledby="title description">
  <title id="title">Do pedido à resposta</title>
  <desc id="description">Um jornalista escreve um pedido de acesso à informação no computador. O pedido e-SIC segue até um órgão público, onde servidores circulam e um deles consulta pilhas de documentos para responder.</desc>
  <style>
    :root{color-scheme:light}
    .ink{stroke:#2a2b30;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.tiny{font:700 11px Arial,sans-serif;letter-spacing:1.2px;fill:#34343a}.small{font:700 15px Arial,sans-serif;fill:#292a30}.line{fill:none;stroke:#a13242;stroke-width:4;stroke-linecap:round;stroke-dasharray:7 9}
    #request{animation:request 12s ease-in-out infinite}#response{animation:response 12s ease-in-out infinite}#typing{animation:typing .45s ease-in-out infinite alternate;transform-origin:211px 209px}#reply-arm{animation:reply 2.4s ease-in-out infinite alternate;transform-origin:732px 197px}#walker-a{animation:walk-a 8s ease-in-out infinite alternate}#walker-b{animation:walk-b 7s ease-in-out infinite alternate}#walker-c{animation:walk-c 9s ease-in-out infinite alternate}#paper{animation:paper 2.4s ease-in-out infinite alternate;transform-origin:747px 219px}
    @keyframes request{0%,15%{transform:translate(0,0);opacity:1}35%{transform:translate(210px,-27px);opacity:1}58%{transform:translate(430px,-10px);opacity:1}64%,100%{transform:translate(430px,-10px);opacity:0}}
    @keyframes response{0%,64%{transform:translate(0,0);opacity:0}70%{transform:translate(0,0);opacity:1}95%{transform:translate(-490px,22px);opacity:1}100%{transform:translate(-490px,22px);opacity:0}}
    @keyframes typing{to{transform:rotate(-14deg)}}@keyframes reply{to{transform:rotate(-18deg)}}@keyframes paper{to{transform:rotate(5deg)}}
    @keyframes walk-a{to{transform:translate(92px,-38px)}}@keyframes walk-b{to{transform:translate(-70px,30px)}}@keyframes walk-c{to{transform:translate(48px,18px)}}
    @media(prefers-reduced-motion:reduce){#request,#response,#typing,#reply-arm,#walker-a,#walker-b,#walker-c,#paper{animation:none}#response{opacity:1}}
  </style>
  <defs>
    <pattern id="floor" width="16" height="16" patternUnits="userSpaceOnUse"><path d="M16 0H0V16" fill="none" stroke="#d3d3d0" stroke-width=".55"/></pattern>
    <g id="person" class="ink"><ellipse cy="28" rx="13" ry="4" fill="#c8c7c4" stroke="none"/><path d="M-7 13l-3 13m13-13 4 13M-9-3l-6 11m23-11 6 11" fill="none"/><path d="M-9-7l18 0-3 22H-6z" fill="#a13242"/><circle cy="-16" r="8" fill="#e7b18e"/><path d="M-8-18q2-12 13-7l4 7" fill="#2a2b30" stroke="none"/></g>
    <g id="person-blue" class="ink"><ellipse cy="28" rx="13" ry="4" fill="#c8c7c4" stroke="none"/><path d="M-7 13l-3 13m13-13 4 13M-9-3l-6 11m23-11 6 11" fill="none"/><path d="M-9-7l18 0-3 22H-6z" fill="#456778"/><circle cy="-16" r="8" fill="#bd8f72"/><path d="M-8-18q2-12 13-7l4 7" fill="#2a2b30" stroke="none"/></g>
    <g id="plant" class="ink"><path d="M-10 3 10 3 7 19-7 19z" fill="#f9f7ef"/><path d="M0 3V-22m0 15-13-13m13 9 12-15" fill="none" stroke="#456d54" stroke-width="3"/><path d="M-14-21q-6 11 8 12 2-10-8-12zm26-5q12 7 2 16-9-3-2-16zM-2-28q11 5 2 16-10-5-2-16z" fill="#689b77" stroke="#456d54" stroke-width="1"/></g>
    <g id="stack" class="ink"><path d="M0 20l38 0 11 7-38 0z" fill="#fcf9ee"/><path d="M0 13l38 0 11 7-38 0z" fill="#eee5d5"/><path d="M0 6l38 0 11 7-38 0z" fill="#fcf9ee"/><path d="M0 0l38 0 11 6-38 0z" fill="#eee5d5"/><path d="M10 7l8 0m-7 7 17 0m-17 7 25 0" stroke="#a13242" stroke-width="1"/></g>
  </defs>
  <rect width="960" height="360" fill="#f3f1e9"/>
  <path d="M20 215 378 44 944 206 578 342z" fill="#e4e5e3" class="ink"/>
  <path d="M20 215 378 44 944 206 578 342z" fill="url(#floor)" opacity=".48"/>
  <path d="M20 215v10l558 127v-10M578 342v10l366-137v-9" fill="#41434b" class="ink"/>
  <path d="M100 234 392 91M358 290l291-132" class="line" opacity=".28"/>
  <path d="M382 57 930 211" fill="none" stroke="#a13242" stroke-width="10" opacity=".92"/>
  <path d="M268 116c95-52 178-55 268-35 91 20 145 35 221 66" class="line"/>
  <path d="M753 268C593 319 350 293 211 271" fill="none" stroke="#537969" stroke-width="3" stroke-dasharray="5 10"/>
  <!-- Reporter, desk and computer -->
  <g class="ink">
    <path d="M94 198 198 149 296 175 190 227z" fill="#fffdf7"/><path d="M94 198v11l96 29v-11l106-52v12l-106 51" fill="#d2d3d0"/>
    <path d="m145 184 41-19 48 13-42 20z" fill="#41434b"/><path d="m145 184 47 14v-27l-47-14z" fill="#555762"/><path d="m150 162 37 11v18l-37-11z" fill="#aac4bb"/>
    <path d="m192 201 31-15 27 7-31 15z" fill="#deded8"/><path d="m197 201 26-12m-20 15 26-12m-20 15 26-12" stroke="#66686c" stroke-width=".8"/>
    <path d="m108 212 16 5v26l-16-5z" fill="#a13242"/><path d="m253 199 16-8v27l-16 8z" fill="#a13242"/>
  </g>
  <g class="ink"><ellipse cx="215" cy="276" rx="21" ry="6" fill="#bcbdb9" stroke="none"/><path d="m206 241-8 31m22-28 8 28" fill="none"/><path d="m199 208 29 0-4 39-28-8z" fill="#a13242"/><circle cx="214" cy="196" r="13" fill="#dca888"/><path d="M201 193q2-17 18-12l8 12" fill="#303037" stroke="none"/><path d="m199 215-16-8 7-11m37 18 12-13" fill="none" stroke-width="5"/></g>
  <g id="typing" class="ink"><path d="m214 213 4-9-8-4" fill="none" stroke-width="4"/></g>
  <text x="82" y="61" class="tiny">01 · PEDIDO</text><text x="82" y="84" class="small">Jornalista</text>
  <!-- Government building with a restrained civic silhouette -->
  <g class="ink">
    <path d="m394 183 100-48 115 32-106 51z" fill="#c7c8c5"/>
    <path d="m398 126 102-46 104 28-101 49z" fill="#f9f7ef"/><path d="m398 126 105 31v62l-105-29z" fill="#ebeae3"/><path d="m503 157 101-49v63l-101 48z" fill="#d5d6d2"/>
    <path d="m390 125 110-52 112 33-109 52z" fill="#dfdcd4"/><path d="m392 124 110-50 109 32" fill="none" stroke="#a13242" stroke-width="7"/>
    <path d="m422 147 15 4v48l-15-4zm31 9 15 4v48l-15-4zm30 9 15 4v48l-15-4z" fill="#fffdf8"/>
    <path d="m526 165 15-7v45l-15 8zm31-15 15-7v47l-15 7z" fill="#f4f2eb"/>
    <path d="m455 131 43-20 43 12-43 21z" fill="#a13242"/><text x="472" y="132" fill="#fffdf7" font-family="Arial,sans-serif" font-size="12" font-weight="700">LAI</text>
    <path d="M560 127V67" fill="none"/><path d="m561 68 31 9-31 16z" fill="#42805c"/><circle cx="574" cy="79" r="3" fill="#f2cc59" stroke="none"/>
  </g>
  <text x="415" y="26" class="tiny">02 · e-SIC</text><text x="415" y="47" class="small">Órgão público</text>
  <!-- Busy public office -->
  <g class="ink">
    <path d="m652 206 101-48 153 43-104 48z" fill="#f8f6ef"/><path d="m652 206 150 43v10l-150-43zm150 43 104-48v11l-104 47z" fill="#d2d3d0"/>
    <path d="m680 194 54-25 65 18-57 27z" fill="#fffdf9"/><path d="m680 194 62 20v8l-62-19zm62 20 57-27v9l-57 26z" fill="#d7d8d4"/>
    <path d="m700 186 24-11 27 7-25 12z" fill="#464951"/><path d="m700 186 26 8v-22l-26-7z" fill="#555762"/><path d="m704 169 18 5v15l-18-5z" fill="#aac4bb"/>
    <path d="m817 204 42-20 28 8-44 21z" fill="#fffdf8"/><path d="m817 204 26 9v8l-26-9zm26 9 44-21v8l-44 21z" fill="#d7d8d4"/>
  </g>
  <use xlink:href="#stack" x="775" y="165"/><use xlink:href="#stack" x="837" y="183"/><use xlink:href="#stack" x="864" y="202"/>
  <g id="paper" class="ink"><path d="m742 215 31-13 27 7-32 15z" fill="#fffdf8"/><path d="m751 213 25 6m-18-9 23 7" stroke="#a13242" stroke-width="1"/></g>
  <g class="ink"><ellipse cx="735" cy="274" rx="17" ry="5" fill="#babbb7" stroke="none"/><path d="m728 239-5 32m13-30 7 30" fill="none"/><path d="m724 207 22-1-3 37-23-6z" fill="#456778"/><circle cx="734" cy="195" r="11" fill="#bd8e70"/><path d="m725 190q3-12 14-7l7 9" fill="#292a30" stroke="none"/></g>
  <g id="reply-arm" class="ink"><path d="m733 214 18 5 9-9" fill="none" stroke-width="4"/></g>
  <g id="walker-a"><use xlink:href="#person" transform="translate(652 251) scale(.7)"/></g><g id="walker-b"><use xlink:href="#person-blue" transform="translate(862 257) scale(.72)"/></g><g id="walker-c"><use xlink:href="#person" transform="translate(805 276) scale(.6)"/></g>
  <use xlink:href="#person-blue" transform="translate(603 229) scale(.55)"/><use xlink:href="#person" transform="translate(688 291) scale(.52)"/><use xlink:href="#person-blue" transform="translate(906 227) scale(.5)"/>
  <use xlink:href="#plant" transform="translate(626 164) scale(.72)"/><use xlink:href="#plant" transform="translate(893 183) scale(.62)"/>
  <text x="698" y="60" class="tiny">03 · RESPOSTA</text><text x="698" y="82" class="small">Servidores e documentos</text>
  <!-- Two messages move between the desk and public office -->
  <g transform="translate(260 104)"><g id="request"><rect x="-22" y="-17" width="44" height="33" rx="4" fill="#fffaf1" class="ink"/><path d="m-22-13 22 15 22-15" fill="none" stroke="#a13242" stroke-width="2"/><text x="-18" y="-23" class="tiny" style="font-size:12px;fill:#a13242">e-SIC</text></g></g>
  <g transform="translate(750 282)"><g id="response"><rect x="-21" y="-17" width="42" height="32" rx="3" fill="#e7f2e7" class="ink"/><path d="m-21-13 21 15 21-15" fill="none" stroke="#537969" stroke-width="2"/><circle cx="21" cy="-17" r="9" fill="#537969"/><path d="m17-17 3 3 5-6" fill="none" stroke="#fff" stroke-width="2"/></g></g>
</svg>
